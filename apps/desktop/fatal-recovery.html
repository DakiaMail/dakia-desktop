<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dakia</title>
    <style>
      :root {
        color: #1f2933;
        background: #f7f8fa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        width: min(460px, calc(100vw - 48px));
        padding: 32px;
        box-sizing: border-box;
        background: #fff;
        border: 1px solid #d6d9de;
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(31, 41, 51, 0.12);
      }
      h1 {
        margin: 0 0 16px;
        font-size: 21px;
        line-height: 1.3;
      }
      p {
        margin: 0 0 24px;
        color: #45515e;
        font-size: 15px;
        line-height: 1.5;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 7px;
        background: #304b78;
        color: #fff;
        padding: 10px 16px;
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #8cbbff;
        outline-offset: 2px;
      }
      button:disabled {
        cursor: default;
        opacity: 0.65;
      }
    </style>
  </head>
  <body>
    <main
      data-fatal-recovery
      role="alert"
      aria-labelledby="fatal-recovery-title"
    >
      <h1 id="fatal-recovery-title"></h1>
      <p id="fatal-recovery-message"></p>
      <button id="fatal-recovery-quit" type="button">Quit Dakia</button>
    </main>
    <script type="module" src="/src/fatalRecovery.ts"></script>
  </body>
</html>
