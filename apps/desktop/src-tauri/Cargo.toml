[package]
name = "dakia-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[lib]
name = "dakia_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# A deliberately non-default native acceptance build. It permits only an
# explicit loopback CA and isolated app-data directory supplied by the test
# runner; release and ordinary development builds do not compile this path.
native-mail-safety-fixture = ["dakia-core/native-mail-safety-fixture"]

[[bin]]
name = "dakia-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
dakia-core = { path = "../../../crates/dakia-core" }
directories.workspace = true
libc = "0.2"
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
whatlang = "0.18"
tauri = { version = "2", features = ["image-png", "protocol-asset", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2.3.2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
notify-rust = "4"

[dev-dependencies]
dakia-core = { path = "../../../crates/dakia-core", features = ["native-mail-safety-fixture"] }
tauri = { version = "2", features = ["test"] }
flate2 = "1"
tar = "0.4"
tempfile = "3"
tokio-rustls.workspace = true
