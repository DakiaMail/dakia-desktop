[package]
name = "dakia-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Deliberately opt-in: only the standalone cargo-fuzz crate exposes the
# byte-oriented MIME exercise API. Production builds do not include it.
fuzzing = []
# Compiles the explicitly loopback-only trust seam used by the isolated native
# mail-safety acceptance harness. Normal application and release builds never
# include this feature, so their IMAP connector remains WebPKI-only.
native-mail-safety-fixture = []
# Builds a dedicated SQLite I/O-fault integration binary. Use
# scripts/run-sqlite-fault-injection.sh so bundled SQLite instruments its
# default VFS without enabling unavailable Tcl hooks. Ordinary builds leave
# this disabled.
sqlite-fault-injection = ["dep:libsqlite3-sys"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
directories.workspace = true
fastembed = { version = "=5.13.1", default-features = false, features = ["ort-download-binaries-native-tls"] }
lettre.workspace = true
libc.workspace = true
libsqlite3-sys = { version = "=0.30.1", features = ["bundled"], optional = true }
mail-auth = { version = "0.10", default-features = false, features = ["ring"] }
mail-parser.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
ring.workspace = true
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["std"] }
schemars.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
tracing.workspace = true
url.workspace = true
uuid.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
tempfile = "3"

[[test]]
name = "sqlite_fault_injection"
path = "tests/sqlite_fault_injection.rs"
required-features = ["sqlite-fault-injection"]
