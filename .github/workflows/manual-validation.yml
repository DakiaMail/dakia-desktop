name: Manual validation

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Validation lane to run
        required: true
        type: choice
        options:
          - full-source
          - coverage
          - fuzz
          - provider-smoke
      reason:
        description: Why this manually dispatched validation is needed
        required: true
        type: string
      enable_provider_smoke:
        description: Explicitly permit a credentialed provider smoke attempt
        required: true
        default: false
        type: boolean

concurrency:
  group: manual-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-request:
    name: Validate manual request
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require a meaningful reason
        env:
          REASON: ${{ inputs.reason }}
        run: test -n "$(printf '%s' "$REASON" | tr -d '[:space:]')"
      - name: Guard provider smoke explicit opt-in
        if: inputs.lane == 'provider-smoke'
        env:
          ENABLE_PROVIDER_SMOKE: ${{ inputs.enable_provider_smoke }}
        run: test "$ENABLE_PROVIDER_SMOKE" = true

  full-source:
    name: Full Linux source suite
    needs: validate-request
    if: inputs.lane == 'full-source'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # This environment holds a dedicated, bucket-scoped R2 credential. Its
    # deployment-branch policy must admit only trusted refs; do not reuse it
    # from pull_request, provider-smoke, or hosted packaging jobs.
    environment: sccache-r2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: 20.19.0
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-node-20.19.0-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-node-20.19.0-
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy
          echo 'RUSTUP_TOOLCHAIN=1.89.0' >> "$GITHUB_ENV"
      - name: Install verified Rust compiler cache
        run: |
          archive="$RUNNER_TEMP/sccache-v0.17.0-x86_64-unknown-linux-musl.tar.gz"
          install_dir="$RUNNER_TEMP/sccache-bin"
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/mozilla/sccache/releases/download/v0.17.0/sccache-v0.17.0-x86_64-unknown-linux-musl.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '67c4a96dd237c1f518f6b36083f270f9976d516f1e57fce891755ea782e50006' "$archive" | sha256sum --check -
          mkdir -p "$install_dir"
          tar -xzf "$archive" --strip-components=1 -C "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/sccache" --version
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-${{ runner.os }}-${{ runner.arch }}-rust-1.89.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-deps-${{ runner.os }}-${{ runner.arch }}-rust-1.89.0-
      - name: Start private R2 compiler cache
        env:
          SCCACHE_BUCKET: dakia-sccache
          SCCACHE_ENDPOINT: https://b225fd2027198472b627795dd126aa15.r2.cloudflarestorage.com
          SCCACHE_REGION: auto
          SCCACHE_S3_KEY_PREFIX: dakia/linux-x64/rust-1.89.0/
          SCCACHE_S3_RW_MODE: READ_WRITE
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          sccache --start-server
      - name: Install Linux dependencies for workspace tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci --ignore-scripts
      - run: git lfs pull --include='apps/desktop/src-tauri/resources/email-classifier-v2/model.onnx,apps/desktop/src-tauri/resources/email-classifier-v2/tokenizer.json'
      - name: Run full source suite with private R2 compiler cache
        env:
          RUSTC_WRAPPER: sccache
          # sccache cannot cache rustc incremental compilation outputs.
          CARGO_INCREMENTAL: 0
        run: |
          npm run bundle:cli:dev
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          npm run typecheck
          npm run format:check
          npm run test -- --maxWorkers=1
          npm run test:release-scripts
          npm run build:web
      - name: Report Rust compiler cache statistics
        if: always()
        run: sccache --show-stats
  coverage:
    name: Coverage baseline candidate
    needs: validate-request
    if: inputs.lane == 'coverage'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: 20.19.0
      - name: Install branch-capable Rust coverage tooling
        run: |
          rustup toolchain install nightly-2026-10-17 --profile minimal --component llvm-tools-preview
          echo 'RUSTUP_TOOLCHAIN=nightly-2026-10-17' >> "$GITHUB_ENV"
          cargo +nightly-2026-10-17 install cargo-llvm-cov --version 0.9.1 --locked
      - name: Install Linux dependencies for workspace coverage
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci --ignore-scripts
      - name: Fetch classifier fixtures needed by the full Rust test suite
        run: git lfs pull --include='apps/desktop/src-tauri/resources/email-classifier-v2/model.onnx,apps/desktop/src-tauri/resources/email-classifier-v2/tokenizer.json'
      - name: Prepare the required Tauri CLI sidecar
        run: npm run bundle:cli:dev
      - name: Install the lock-matched Vitest coverage provider for this manual lane
        run: |
          locked_vitest_version="$(node -p "require('./package-lock.json').packages['node_modules/vitest'].version")"
          test -n "$locked_vitest_version"
          npm install --ignore-scripts --no-save --package-lock=false --no-audit --legacy-peer-deps "vitest@$locked_vitest_version" "@vitest/coverage-v8@$locked_vitest_version"
          installed_vitest_version="$(node -p "require('./node_modules/vitest/package.json').version")"
          installed_provider_version="$(node -p "require('./node_modules/@vitest/coverage-v8/package.json').version")"
          test "$installed_vitest_version" = "$locked_vitest_version"
          test "$installed_provider_version" = "$locked_vitest_version"
      - name: Generate Rust coverage reports without the LLVM full-LCOV crash path
        run: |
          mkdir -p coverage
          chmod +x scripts/coverage-llvm-cov-proxy.mjs
          target_libdir="$(rustc +nightly-2026-10-17 --print target-libdir)"
          llvm_tools_dir="$(dirname "$target_libdir")/bin"
          export RUST_COVERAGE_REAL_LLVM_COV="$llvm_tools_dir/llvm-cov"
          export LLVM_PROFDATA="$llvm_tools_dir/llvm-profdata"
          test -x "$RUST_COVERAGE_REAL_LLVM_COV"
          test -x "$LLVM_PROFDATA"
          "$RUST_COVERAGE_REAL_LLVM_COV" --version
          "$LLVM_PROFDATA" --version
          export RUST_COVERAGE_EXPORT_LOG="$PWD/coverage/rust-export-invocations.jsonl"
          export LLVM_COV="$PWD/scripts/coverage-llvm-cov-proxy.mjs"
          node scripts/create-rust-coverage-provenance.mjs --prepare-source \
            --source-root . \
            --source-manifest coverage/rust-source-manifest.json \
            --source-digest-output coverage/rust-source-digest.txt
          cargo +nightly-2026-10-17 llvm-cov clean --workspace
          cargo +nightly-2026-10-17 llvm-cov --workspace --branch --locked --no-report
          cargo +nightly-2026-10-17 llvm-cov report --workspace --branch --locked --lcov --skip-functions --output-path coverage/rust.lcov
          cargo +nightly-2026-10-17 llvm-cov report --workspace --branch --locked --json --output-path coverage/rust-functions.json
          node scripts/create-rust-coverage-provenance.mjs \
            --source-root . \
            --source-manifest coverage/rust-source-manifest.json \
            --source-digest-output coverage/rust-source-digest.txt \
            --export-log coverage/rust-export-invocations.jsonl \
            --line-branch-lcov coverage/rust.lcov \
            --functions-json coverage/rust-functions.json \
            --line-branch-receipt coverage/rust-line-branch.receipt.json \
            --functions-receipt coverage/rust-functions.receipt.json \
            --toolchain "nightly-2026-10-17 cargo-llvm-cov-0.9.1"
          profile_path="$(node -p "require('./coverage/rust-line-branch.receipt.json').profilePath")"
          profile_sha256="$(node -p "require('./coverage/rust-line-branch.receipt.json').profileSha256")"
          node scripts/normalize-rust-coverage-lcov.mjs \
            --line-branch-lcov coverage/rust.lcov \
            --functions-json coverage/rust-functions.json \
            --profile "$profile_path" \
            --expected-profile-sha256 "$profile_sha256" \
            --source-digest "$(cat coverage/rust-source-digest.txt)" \
            --source-manifest coverage/rust-source-manifest.json \
            --line-branch-receipt coverage/rust-line-branch.receipt.json \
            --functions-receipt coverage/rust-functions.receipt.json \
            --output coverage/rust-normalized.lcov \
            --summary coverage/rust-normalization-summary.json
          node --input-type=module - coverage/rust-normalized.lcov <<'NODE'
          import { readFileSync } from "node:fs";
          import { coverageAvailability, summarizeLcov } from "./scripts/coverage-ratchet.mjs";

          const summary = summarizeLcov(readFileSync(process.argv[2], "utf8"));
          if (coverageAvailability(summary).branches.status !== "observed") {
            throw new Error("Rust branch LCOV observations are unavailable; coverage candidate cannot be accepted");
          }
          NODE
          npm run test -- --coverage.enabled true --coverage.provider v8 --coverage.reporter lcov --coverage.reportsDirectory coverage/frontend --maxWorkers=1
          test -f coverage/frontend/lcov.info
      - name: Compare an existing ratchet or write a review candidate
        run: |
          baseline_args=()
          if [ -f testdata/coverage/baseline.json ]; then
            baseline_args=(--baseline testdata/coverage/baseline.json)
          fi
          node scripts/coverage-ratchet.mjs \
            --rust-lcov coverage/rust-normalized.lcov \
            --rust-normalization-summary coverage/rust-normalization-summary.json \
            --frontend-lcov coverage/frontend/lcov.info \
            --output coverage/candidate.json \
            "${baseline_args[@]}"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  fuzz:
    name: Bounded property and parser corpus
    needs: validate-request
    if: inputs.lane == 'fuzz'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: 20.19.0
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          echo 'RUSTUP_TOOLCHAIN=1.89.0' >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - name: Fetch classifier fixtures needed to compile the core test crate
        run: git lfs pull --include='apps/desktop/src-tauri/resources/email-classifier-v2/model.onnx,apps/desktop/src-tauri/resources/email-classifier-v2/tokenizer.json'
      - name: Run checked-in fixed-seed property and MIME corpus regressions
        run: |
          ./scripts/run-fixed-seed-property-regressions.sh 3

  provider-smoke:
    name: Credentialed provider smoke
    needs: validate-request
    if: inputs.lane == 'provider-smoke' && inputs.enable_provider_smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: provider-smoke
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: 20.19.0
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          echo 'RUSTUP_TOOLCHAIN=1.89.0' >> "$GITHUB_ENV"
      - name: Compile the exact locked provider smoke binary
        run: cargo build --locked -p dakia-cli --bin dakia-provider-smoke
      - name: Run the read-neutral IMAP and SMTP auth/QUIT smoke
        env:
          PROVIDER_SMOKE_CONFIG: ${{ secrets.DAKIA_PROVIDER_SMOKE_CONFIG }}
        run: |
          node scripts/provider-smoke-contract.mjs
          target/debug/dakia-provider-smoke
