name: Bug report
description: Report a reproducible Dakia problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include private mail, credentials, tokens, or security vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Dakia version
      placeholder: v0.2.6
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS Apple Silicon
        - macOS Intel
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include minimal reproduction steps and the expected result.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized diagnostics
      description: Remove addresses, message content, credentials, tokens, and local paths.
      render: shell
